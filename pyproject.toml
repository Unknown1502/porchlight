[project]
name = "porchlight"
version = "0.1.0"
description = "Community scam-campaign agent for local elder-fraud coalitions, built on Strands Agents."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dashboard is a data file inside the package, not a module. Without this
# it survives an editable install and vanishes from a wheel, so `/` would 500
# only in the one environment nobody tests.
porchlight = ["dashboard/*.html"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default. CI treats lint as a
# gate, and an implicit rule set means a ruff release can fail the build
# without a line of this project changing — which inverts the property the
# gate exists for.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
